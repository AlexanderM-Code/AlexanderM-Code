name: Generar animación de la serpiente

on:
  schedule:
    - cron: "0 */12 * * *"   # se actualiza cada 12 horas
  workflow_dispatch:          # permite ejecutarla a mano
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVGs de la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0288d1&color_dots=#e3eef1,#b3e5fc,#4fc3f7,#0288d1,#01579b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#4fc3f7&color_dots=#12262e,#1d4b57,#2c7a8a,#3fa9c4,#9be3ff

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
