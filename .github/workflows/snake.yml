name: Generar animación de la serpiente (colores del portafolio)

on:
  schedule:
    - cron: "0 */12 * * *"   # se actualiza cada 12 horas
  workflow_dispatch:          # permite ejecutarla a mano
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVGs de la serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#e2560e&color_dots=#ebe5d8,#c7d0ee,#9fb0e6,#5f78d0,#2141b5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff8a3d&color_dots=#1c1f25,#26304f,#3d5199,#647fe0,#8ea8ff

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
