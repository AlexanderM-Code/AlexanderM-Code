<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="84" viewBox="0 0 1000 84" role="img" aria-label="Contribuciones: mi actividad real del último año en GitHub."><title>Contribuciones: mi actividad real del último año en GitHub.</title><style>@font-face{font-family:PX;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:SG5;src:url(data:font/woff2;base64,) format("woff2")}
.px{font-family:PX,'Courier New',monospace;font-weight:400}
.sg{font-family:SG5,'Segoe UI',system-ui,sans-serif;font-weight:500}
.sgb{font-family:SG7,'Segoe UI',system-ui,sans-serif;font-weight:700}
.mono{font-family:JB4,ui-monospace,Consolas,monospace}
.monob{font-family:JB7,ui-monospace,Consolas,monospace;font-weight:700}
.pix{shape-rendering:crispEdges}
@keyframes blink{50%{opacity:0}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes win{0%,60%{opacity:1}70%,90%{opacity:.15}}
@keyframes led{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cursor{animation:blink 1s steps(1) infinite}
.tw{animation:tw 3s steps(3) infinite}
.win{animation:win 7s steps(1) infinite}
.led{animation:led 1.6s steps(2) infinite}
.rise{opacity:0;animation:rise .5s steps(4) forwards}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s steps(6) both}
.bob{animation:bob 1.8s steps(2) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect width="1000" height="84" fill="#0a1820"/><g class="pix"><rect x="4" y="80" width="988" height="4" fill="#050d12"/><rect x="996" y="4" width="4" height="76" fill="#050d12"/><rect x="4" y="0" width="988" height="80" fill="#2f5a68"/><rect x="0" y="4" width="996" height="72" fill="#2f5a68"/><rect x="8" y="4" width="980" height="72" fill="#10242d"/><rect x="4" y="8" width="988" height="64" fill="#10242d"/></g><text x="32" y="44" class="px" font-size="24" fill="#ffb74d" letter-spacing="1">CONTRIBUCIONES</text><text x="32" y="66" class="sg" font-size="14" fill="#a9c3cb">Mi actividad real del último año en GitHub, actualizada cada 12 horas.</text></svg>
