<svg xmlns="http://www.w3.org/2000/svg" width="490" height="390" viewBox="0 0 490 390" role="img" aria-label="Proyecto de grado: aplicativo web de historias clínicas para el Técnico en Salud Oral. Mi rol: coautor del anteproyecto."><title>Proyecto de grado: aplicativo web de historias clínicas para el Técnico en Salud Oral. Mi rol: coautor del anteproyecto.</title><style>@font-face{font-family:PX;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:SG5;src:url(data:font/woff2;base64,) format("woff2")}
.px{font-family:PX,'Courier New',monospace;font-weight:400}
.sg{font-family:SG5,'Segoe UI',system-ui,sans-serif;font-weight:500}
.sgb{font-family:SG7,'Segoe UI',system-ui,sans-serif;font-weight:700}
.mono{font-family:JB4,ui-monospace,Consolas,monospace}
.monob{font-family:JB7,ui-monospace,Consolas,monospace;font-weight:700}
.pix{shape-rendering:crispEdges}
@keyframes blink{50%{opacity:0}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes win{0%,60%{opacity:1}70%,90%{opacity:.15}}
@keyframes led{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}}
